<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本地立绘预览 · 次元角色档案馆 | Anime Character Archive</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0%,#28284f,#080c19 70%);color:#f1f1ff;font:15px/1.6 system-ui,'Microsoft YaHei',sans-serif}header{max-width:1300px;margin:auto;padding:32px 22px 16px}a{color:#bfb7ff}h1{margin:4px 0;font-size:clamp(26px,4vw,42px)}p{color:#a9b0ca}.grid{max-width:1300px;margin:auto;padding:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:20px}.card{background:#131c30;border:1px solid #ffffff22;border-radius:19px;overflow:hidden;box-shadow:0 15px 40px #0004}.pic{height:350px;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 65%,#404565,#1b2238 70%);padding:10px}.pic img{width:100%;height:100%;object-fit:contain}.info{padding:12px 15px}.info strong{display:block}.info small{color:#9da9c5}</style></head><body><header><a href="./characters.html">← 返回角色图鉴</a><h1>本地打包立绘 · 12 张</h1><p>这些 PNG 图片已经存放于此 GitHub 仓库的 assets/portraits/ 文件夹，不依赖外站加载。此页仅用于核查保存的角色素材，并非 12 套动画。</p></header><main class="grid" id="gallery"></main><script>const ids=["c012","c015","c112","c170","c181","c191","c200","c222","c233","c270","c280","c282"],names=["安妮丝 Anis","泳装安妮丝 Anis Summer","毒蛇 Viper","普丽瓦蒂 Privaty","梅登 Maiden","爱丽丝 Alice","露菲 Rupee","红莲 Scarlet","桃乐丝 Dorothy","布兰儿 Blanc","罗珊娜 Rosanna","樱花 Sakura"];document.getElementById('gallery').innerHTML=ids.map((id,i)=>'<article class="card"><div class="pic">'+('<img loading="lazy" src="./assets/portraits/'+id+'.png" alt="'+names[i]+'">')+'</div><div class="info"><strong>'+names[i]+'</strong><small>'+id+' · 本地 PNG</small></div></article>').join('');</script></body></html>
