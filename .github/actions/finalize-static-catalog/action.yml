name: Finalize static character catalog
description: Build previews and validate the complete catalog before publishing new art.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install image validation
      shell: bash
      run: python -m pip install --disable-pip-version-check Pillow
    - name: Build local thumbnails and intrinsic artwork dimensions
      shell: bash
      run: python scripts/build_portrait_thumbs.py
    - name: Validate complete archive before publishing
      shell: bash
      run: node tests/smoke.mjs
