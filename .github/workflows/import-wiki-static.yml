name: Import additional static full-body art
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-wiki-static.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check wiki full-body files and download verified PNGs
        run: python scripts/import_wiki_fullbody.py
      - name: Commit newly imported local images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/characters.json assets/portraits/
          if ! git diff --cached --quiet; then
            git commit -m "Add newly verified static full-body portraits"
            git push origin HEAD:main
          fi
