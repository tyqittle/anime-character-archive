name: Import additional static full-body art
# Content imports are explicit jobs; source edits are checked by verify.yml.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: art-import-main
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check wiki full-body files and download verified PNGs
        run: python scripts/import_wiki_fullbody.py
      - name: Finalize static catalog with shared image pipeline
        uses: ./.github/actions/finalize-static-catalog
      - name: Commit newly imported local images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/characters.json assets/portraits/ assets/thumbs/
          if ! git diff --cached --quiet; then
            git commit -m "Add newly verified static full-body portraits"
            git push origin HEAD:main
          fi
