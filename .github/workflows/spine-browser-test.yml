name: Verify Spine animation in Chrome
on:
  push:
    branches: [main]
    paths:
      - 'data/animation-catalogs.json'
      - 'assets/js/shared/catalog-registry.js'
      - 'scripts/catalog_registry.mjs'
      - '.github/workflows/spine-browser-test.yml'
      - 'scripts/test_spine_browser.mjs'
      - 'scripts/test_spine_ui_browser.mjs'
      - 'assets/spine-theater-layout.css'
      - 'scripts/test_bluearchive_atlas_uv.mjs'
      - 'spine.html'
      - 'assets/js/spine/spine-runtime.js'
      - 'assets/js/spine/viewer-controls.js'
      - 'assets/js/spine/performance.js'
      - 'data/spine-characters.json'
      - 'tests/smoke.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless browser driver
        run: npm install --no-save --no-package-lock playwright-core@1.56.1 pngjs@7.0.0
      - name: Start local static site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/site.log 2>&1 &
          sleep 2
      - name: Test Blue Archive atlas rotation UV mapping in Chromium
        run: node scripts/test_bluearchive_atlas_uv.mjs
      - name: Verify selection, page navigation, and player UX
        run: node scripts/test_spine_ui_browser.mjs
      - name: Test actual character playback in Chromium
        run: node scripts/test_spine_browser.mjs
      - name: Upload browser test details even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spine-browser-results
          path: |
            /tmp/spine-browser-results.json
            /tmp/ba-rotation-results.json
            /tmp/ba-ch0145-after-fix.png
          if-no-files-found: warn
