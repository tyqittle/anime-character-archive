name: Probe live Pages address
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages-live-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose published URL and redirects from GitHub runner
        shell: bash
        run: |
          set +e
          echo "=== DNS ==="
          getent ahostsv4 tyqittle.github.io | head -n 5
          echo "=== HTTP probes ==="
          # Automatically follow this repository's current name after future renames.
          site_base="/${GITHUB_REPOSITORY#*/}"
          for path in "$site_base/" "$site_base/characters.html" "$site_base/spine.html"; do
            echo "== $path =="
            curl -L -sS -m 25 --max-redirs 7 -D /tmp/gh-headers -o /tmp/gh-body -w 'FINAL_HTTP=%{http_code} EFFECTIVE_URL=%{url_effective} REDIRECTS=%{num_redirects} REMOTE_IP=%{remote_ip} TLS_VERIFY=%{ssl_verify_result}\n' "https://tyqittle.github.io$path"
            grep -iE '^(HTTP/|location:|content-type:|content-length:|server:)' /tmp/gh-headers | tail -n 15
            echo "Body first bytes:"
            head -c 220 /tmp/gh-body | tr '\n' ' '
            echo
          done
      - name: Verify actually published dynamic game menu and models
        shell: bash
        run: |
          set -euo pipefail
          base="https://tyqittle.github.io/${GITHUB_REPOSITORY#*/}"
          curl --fail --location --silent --show-error --connect-timeout 12 --max-time 40 "$base/spine.html?publish-check=${GITHUB_SHA}" -o /tmp/live-spine.html
          curl --fail --location --silent --show-error --connect-timeout 12 --max-time 40 "$base/data/live2d-highquality.json?publish-check=${GITHUB_SHA}" -o /tmp/live-hq.json
          curl --fail --location --silent --show-error --connect-timeout 12 --max-time 40 "$base/data/live2d-moregames.json?publish-check=${GITHUB_SHA}" -o /tmp/live-more.json
          python3 - <<'PY'
          from html.parser import HTMLParser
          import json
          from pathlib import Path
          class Menu(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_select = False
                  self.items = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "select" and attrs.get("id") == "gameFilter":
                      self.in_select = True
                  if tag == "option" and self.in_select:
                      self.items.append(attrs.get("value"))
              def handle_endtag(self, tag):
                  if tag == "select":
                      self.in_select = False
          content=Path("/tmp/live-spine.html").read_text(encoding="utf-8")
          parsed=Menu()
          parsed.feed(content)
          expected=["all","girldimension","sinsevendeadlysins","touhoucannonball","girlscafegun"]
          print("ACTUAL_LIVE_MENU",parsed.items)
          assert parsed.items[:5] == expected, "Live Pages dropdown is stale or missing 4 added games"
          hq=json.loads(Path("/tmp/live-hq.json").read_text(encoding="utf-8"))
          more=json.loads(Path("/tmp/live-more.json").read_text(encoding="utf-8"))
          print("ACTUAL_LIVE_CATALOG_COUNTS",len(hq["characters"]),len(more["characters"]))
          assert len(hq["characters"]) == 196 and len(more["characters"]) == 148
          assert '20261023-hq-v1' in content,"Deployed browser code is not latest Live2D runtime"
          print("PASS: public GitHub Pages serves game menu and both model catalogs")
          PY

      - name: Verify new games visually in a real public browser session
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright-core@1.56.1 pngjs@7.0.0
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {chromium} from 'playwright-core';
          import {PNG} from 'pngjs';
          const executable=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium'].find(fs.existsSync);
          if(!executable)throw Error('No Chrome/Chromium in CI runner');
          const browser=await chromium.launch({headless:true,executablePath:executable,args:['--no-sandbox','--enable-webgl','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
          const origin='https://tyqittle.github.io/anime-character-archive/';
          const examples=[['girldimension','gd-001-c_0005'],['sinsevendeadlysins','sds-xch001_01']];
          try{
            const page=await browser.newPage({viewport:{width:1440,height:900},deviceScaleFactor:1});
            for(const [game,id] of examples){
              const url=origin+'spine.html?id='+encodeURIComponent(id)+'&probe='+Date.now();
              const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:35000});
              if(response?.status()!==200)throw Error('Live page HTTP '+response?.status());
              await page.waitForFunction(expected=>document.querySelector('#characters')?.value===expected,id,{timeout:30000});
              await page.waitForFunction(()=>{
                const status=document.querySelector('#status')?.textContent||'';
                return status.startsWith('正在播放：')||status.includes('失败')||status.includes('超时');
              },null,{timeout:95000});
              const state=await page.evaluate(()=>({
                selected:document.querySelector('#characters')?.value,
                game:document.querySelector('#gameFilter')?.value,
                status:document.querySelector('#status')?.textContent,
                frame:!!document.querySelector('iframe.azurlane-live2d-frame'),
                actions:document.querySelector('#animationPicker')?.options.length
              }));
              console.log('PUBLIC_LIVE_GAME_BROWSER_RESULT',JSON.stringify(state));
              if(!state.status.startsWith('正在播放：')||state.game!==game||!state.frame||state.actions<1){
                throw Error('Live site unable to render '+game+': '+JSON.stringify(state));
              }
              await page.waitForTimeout(1100);
              const canvas=page.frameLocator('iframe.azurlane-live2d-frame').locator('#live2dCanvas');
              const png=PNG.sync.read(await canvas.screenshot({timeout:15000}));
              let n=0,total=0,total2=0,step=Math.max(1,Math.floor(png.width*png.height/1500));
              for(let i=0;i<png.width*png.height;i+=step){
                const p=i*4,lum=.2126*png.data[p]+.7152*png.data[p+1]+.0722*png.data[p+2];
                n++;total+=lum;total2+=lum*lum;
              }
              const sd=Math.sqrt(Math.max(0,total2/n-(total/n)**2));
              console.log('PUBLIC_LIVE_GAME_VISIBLE_PIXELS',game,png.width,png.height,sd.toFixed(2));
              if(sd<8)throw Error('Public site rendered a blank/monotone Live2D frame: '+game);
              await page.screenshot({path:'/tmp/public-live-'+game+'.png',fullPage:true});
            }
          }finally{await browser.close()}
          JS
      - name: Upload screenshots of public website
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-live-games-evidence
          path: /tmp/public-live-*.png
          if-no-files-found: ignore
