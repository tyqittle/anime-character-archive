name: Native SpinePet Windows build
on:
  workflow_dispatch:
  push:
    paths:
      - 'native-desktop/**'
      - 'tests/smoke.mjs'
      - '.github/workflows/native-spinepet-windows.yml'
jobs:
  # A green binary build is not enough: validate the site-to-desktop
  # integration contract before an audited package may be published.
  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate desktop integration and repository smoke tests
        run: |
          node tests/smoke.mjs
          node --test tests/test_async_playback.mjs tests/test_animation_frames.mjs tests/test_spine_utf8.mjs
  build-native:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out character archive and bridge
        uses: actions/checkout@v4
      - name: Check out pinned GPL My_SpinePet upstream
        uses: actions/checkout@v4
        with:
          repository: KAIDO-YONAGI/My_SpinePet
          ref: 6690e986b4da31dc89337794bcef1b45e6531303
          path: native-upstream
          persist-credentials: false
      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Validate PowerShell bridge scripts
        shell: pwsh
        run: |
          foreach ($file in @('native-desktop/Open-ArchiveCharacter.ps1','native-desktop/Register-Bridge.ps1')) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { $errors | Format-List; throw "PowerShell parsing failed: $file" }
          }
      - name: Verify site catalog can provide a real supported Spine 4.1 role
        shell: pwsh
        run: |
          & ./native-desktop/Open-ArchiveCharacter.ps1 -CharacterId c015 -ValidateOnly
          & ./native-desktop/Open-ArchiveCharacter.ps1 -CharacterId c010_03 -ValidateOnly
          # Regression: the original c113_01 metadata was wrong; validate
          # real .skel header, not stale versionUnverified/catalog flags.
          & ./native-desktop/Open-ArchiveCharacter.ps1 -CharacterId c113_01 -ValidateOnly
          if ($LASTEXITCODE -ne 0) { throw 'Archive resource bridge validation failed' }
      - name: Apply small GPL bridge extension to original SpinePet app
        shell: pwsh
        run: |
          $legacyImporter = Get-Content ./native-desktop/Open-ArchiveCharacter.ps1 -Raw
          if (-not $legacyImporter.Contains('Assert-NativeSpine41') -or
              $legacyImporter.Contains('$entry.spineVersion') -or
              $legacyImporter.Contains('$entry.versionUnverified')) {
            throw 'Legacy native importer still blocks characters using catalog metadata'
          }
          & ./native-desktop/Patch-Upstream.ps1 -UpstreamRoot ./native-upstream
          # Patch-Upstream.ps1 is pure PowerShell and throws on failure;
          # LASTEXITCODE is stale after non-native scripts and must not be checked here.
          $patched = Get-Content ./native-upstream/SpinePet/src/SpinePet/App.xaml.cs -Raw
          $patched.Split([char]10) | Where-Object { $_ -match 'Archive|OnStartup|StartActivation' } | ForEach-Object { Write-Host $_ }
          $bd2Bridge = Get-Content ./native-upstream/SpinePet/src/SpinePet/NativeBrownDust2Bridge.cs -Raw
          if (-not $bd2Bridge.Contains('EnsureBrownDust2DownloadedAsync') -or
              -not $patched.Contains('RestoreArchiveCharactersAsync()') -or
              -not $patched.Contains('AcceptArchiveStartupArgs(e.Args)')) {
            throw 'Native one-click import integration did not apply'
          }
      - name: Integrate My_SpinePet native character-wheel zoom
        shell: pwsh
        run: |
          & ./native-desktop/Patch-WheelZoom.ps1 -UpstreamRoot ./native-upstream
          & ./native-desktop/Patch-RenderEnvelope.ps1 -UpstreamRoot ./native-upstream
          & ./native-desktop/Patch-ViewportSafety.ps1 -UpstreamRoot ./native-upstream
          $engine = Get-Content ./native-upstream/SpinePet/src/SpinePet/Rendering/Native/NativeCharacterRenderEngine.cs -Raw
          $xaml = Get-Content ./native-upstream/SpinePet/src/SpinePet/Views/MainWindow.xaml -Raw
          $updater = Get-Content ./native-upstream/SpinePet/src/SpinePet/NativeAutoUpdate.cs -Raw
          $input = Get-Content ./native-upstream/SpinePet/src/SpinePet/Rendering/Native/NativeInputWindow.cs -Raw
          $frame = Get-Content ./native-upstream/SpinePet/src/SpinePet/Rendering/Native/NativeFrameRenderer.cs -Raw
          $surface = Get-Content ./native-upstream/SpinePet/src/SpinePet/Rendering/Native/NativeCompositionSurface.cs -Raw
          $silhouette = Get-Content ./native-upstream/SpinePet/src/SpinePet/Rendering/Native/NativeSilhouetteRasterizer.cs -Raw
          $bounds = Get-Content ./native-upstream/SpinePet/src/SpinePet/Rendering/Native/NativeSpineBounds.cs -Raw
          $hitRegion = Get-Content ./native-upstream/SpinePet/src/SpinePet/Rendering/Native/NativeInputRegionCoordinator.cs -Raw
          $voice = Get-Content ./native-upstream/SpinePet/src/SpinePet/NativeBrownDust2Voice.cs -Raw
          $app = Get-Content ./native-upstream/SpinePet/src/SpinePet/App.xaml.cs -Raw
          if (-not $engine.Contains('private void OnNativeMouseWheel') -or
              -not $frame.Contains('NativeSpineBounds observed = state.Geometry.Bounds') -or
              -not $surface.Contains('right <= PixelWidth - AnchorPixelX') -or
              -not $silhouette.Contains('float halfCell = cellSize * 0.38f / pixelScale') -or
              -not $silhouette.Contains('const int Subdivisions = 4') -or
              -not $bounds.Contains('NativeSpineSkinIncludes.Apply(data, probe);') -or
              -not $bounds.Contains('NativeSpineSkinIncludes.Apply(data, setupSkeleton);') -or
              -not $engine.Contains('var bounds = ProjectEnvelope();') -or
              -not $hitRegion.Contains('screen.Bounds,') -or
              -not $engine.Contains('NativeDesktopVoiceRelay.NotifyClicked(') -or
              -not $engine.Contains('FitNewlyLoadedCharacterToMonitor(current);') -or
              -not $xaml.Contains('x:Name="ManualUpdateButton"') -or
              -not $updater.Contains('CheckArchiveUpdatesAsync(manual: true)') -or
              -not $voice.Contains('Char" + clipCode + "_BattleReady_') -or
              -not $app.Contains('InitializeBrownDust2Voice();') -or
              -not $input.Contains('MouseWheelInput')) {
            throw 'Native mouse hit regions, auto-sizing and BD2 voice integration missing'
          }
      - name: Validate pinned Brown Dust 2 voice file is genuine WebM
        shell: pwsh
        run: |
          $url = 'https://raw.githubusercontent.com/Jelosus2/BD2-L2D-Viewer/b899b929df3e3ea883984a05f83c944608a27cb4/src/assets/audios/000201/JP/Char000201_BattleReady_1.webm'
          $path = Join-Path $env:RUNNER_TEMP 'bd2-click-voice.webm'
          Invoke-WebRequest -Uri $url -OutFile $path
          $data = [IO.File]::ReadAllBytes($path)
          if ($data.Length -lt 200 -or $data.Length -gt 3000000 -or
              $data[0] -ne 0x1a -or $data[1] -ne 0x45 -or
              $data[2] -ne 0xdf -or $data[3] -ne 0xa3) {
            throw 'Pinned BD2 voice is missing, oversized, or not WebM'
          }
          Write-Host "PASS: BD2 voice audio source is pinned and WebM header is valid ($($data.Length) bytes)"
          # Exercise the SAME managed decoder that ships in the desktop EXE
          # against a real pinned upstream BD2 Opus voice, not a mock WAV.
          $project = Join-Path $env:RUNNER_TEMP 'bd2-voice-regression'
          dotnet new console --framework net9.0 --output $project --no-restore | Out-Null
          dotnet add (Join-Path $project 'bd2-voice-regression.csproj') package Concentus --version 2.2.2 | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Managed Opus test dependency restore failed' }
          Copy-Item ./native-desktop/NativeBrownDust2WebMDecoder.cs $project
          @'
          using System;
          using System.IO;
          using SpinePet;
          byte[] voice = File.ReadAllBytes(args[0]);
          byte[] wav = NativeBrownDust2WebMDecoder.DecodeToWave(voice);
          if (wav.Length < 1000 ||
              System.Text.Encoding.ASCII.GetString(wav, 0, 4) != "RIFF" ||
              System.Text.Encoding.ASCII.GetString(wav, 8, 4) != "WAVE")
              throw new Exception("BD2 voice failed to decode into PCM WAV");
          Console.WriteLine($"PASS: decoded real BD2 Opus voice to {wav.Length} PCM WAV bytes");
          '@ | Set-Content -Path (Join-Path $project 'Program.cs') -Encoding utf8
          dotnet run --project $project --configuration Release -- $path
          if ($LASTEXITCODE -ne 0) { throw 'Native BD2 WebM to WAV regression failed' }
      - name: Build actual upstream native Direct3D 11 + DirectComposition renderer
        shell: pwsh
        run: |
          dotnet publish ./native-upstream/SpinePet/src/SpinePet/SpinePet.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugSymbols=false -p:DebugType=None -o ./native-dist/app
          if ($LASTEXITCODE -ne 0) { throw 'Native SpinePet publish failed' }
          if (-not (Test-Path ./native-dist/app/SpinePet.exe)) { throw 'Missing native executable' }
      - name: Smoke-test real c015 resource download and atlas page resolution
        shell: pwsh
        run: |
          New-Item -Path ./native-integration-test/app -ItemType Directory -Force | Out-Null
          New-Item -Path ./native-integration-test/app/SpinePet.exe -ItemType File -Force | Out-Null
          Copy-Item ./native-desktop/Open-ArchiveCharacter.ps1 ./native-integration-test/Open-ArchiveCharacter.ps1
          & ./native-integration-test/Open-ArchiveCharacter.ps1 -CharacterId c015 -DownloadOnly
          if ($LASTEXITCODE -ne 0) { throw 'The website-to-native real resource import failed' }
          $assets = @(Get-ChildItem -Path ./native-integration-test/res -Recurse -File)
          if (-not ($assets.Name -contains 'c015_00.skel' -and $assets.Name -contains 'c015_00.atlas' -and $assets.Name -contains 'c015_00.png')) {
            throw 'Missing required complete Spine standing asset files'
          }
          $skeleton = @(Get-ChildItem -Path ./native-integration-test/res -Recurse -Filter 'c015_00.skel')[0].FullName
          $atlas = @(Get-ChildItem -Path ./native-integration-test/res -Recurse -Filter 'c015_00.atlas')[0].FullName
          dotnet run --project ./native-upstream/SpinePet/tools/skeleton-inspector/SkeletonInspector.csproj -c Release -- $skeleton $atlas
          if ($LASTEXITCODE -ne 0) { throw 'Upstream Spine 4.1 parser could not open the imported model' }
          # Reuse the *actual pinned BD2 assets* with the upstream 4.1 reader.
          # A catalog label is not proof that its binary or atlas is compatible.
          $bd2 = (Get-Content ./data/spine-bd2-characters.json -Raw | ConvertFrom-Json).characters |
            Where-Object { $_.id -eq 'bd2-char000201' } | Select-Object -First 1
          if (-not $bd2) { throw 'Missing pinned Brown Dust 2 source record' }
          $bd2Base = [string]$bd2.base
          if (-not $bd2Base.StartsWith('https://raw.githubusercontent.com/Zormolo/Brown-Dust-2-Assets/94a3ac97b8fab7ee054e0826de7d912de0a233ef/assets/spine/character/')) {
            throw 'Brown Dust 2 test source is not pinned'
          }
          New-Item -ItemType Directory -Path ./native-integration-test/bd2 -Force | Out-Null
          foreach ($suffix in @('.skel','.atlas','.png')) {
            Invoke-WebRequest -UseBasicParsing -Uri ($bd2Base+$suffix) -OutFile ('./native-integration-test/bd2/char000201'+$suffix)
            if ($LASTEXITCODE -ne 0) { throw 'Brown Dust 2 sample download failed' }
          }
          dotnet run --project ./native-upstream/SpinePet/tools/skeleton-inspector/SkeletonInspector.csproj -c Release -- ./native-integration-test/bd2/char000201.skel ./native-integration-test/bd2/char000201.atlas
          if ($LASTEXITCODE -ne 0) { throw 'Brown Dust 2 Spine 4.1 reader compatibility test failed' }
          # Run a pixel-based regression against the ACTUAL pinned BD2
          # standing costume (combined skins, lower-body input silhouette).
          # A passing build or a string-matching assertion is NOT sufficient.
          $testProject = './native-upstream/SpinePet/tests/SpinePet.Tests'
          Copy-Item ./native-desktop/ArchiveDesktopFullBodyTests.cs $testProject
          $env:SPINEPET_BD2_TEST_DIR = (Resolve-Path './native-integration-test/bd2').Path
          dotnet test (Join-Path $testProject 'SpinePet.Tests.csproj') -c Release --filter 'FullyQualifiedName~ArchiveDesktopFullBodyTests' --logger 'console;verbosity=normal'
          if ($LASTEXITCODE -ne 0) { throw 'Real BD2 lower-body visual and mouse hit-region regression failed' }
          Remove-Item Env:SPINEPET_BD2_TEST_DIR
          # Second actual 4.1 costume ID: previous code incorrectly accepted
          # only cNNN and rejected cNNN_XX variants altogether.
          & ./native-integration-test/Open-ArchiveCharacter.ps1 -CharacterId c010_03 -DownloadOnly
          if ($LASTEXITCODE -ne 0) { throw 'Costume Spine 4.1 model download failed' }
          $skinSkeleton = @(Get-ChildItem -Path ./native-integration-test/res -Recurse -Filter 'c010_03_00.skel')[0].FullName
          $skinAtlas = @(Get-ChildItem -Path ./native-integration-test/res -Recurse -Filter 'c010_03_00.atlas')[0].FullName
          dotnet run --project ./native-upstream/SpinePet/tools/skeleton-inspector/SkeletonInspector.csproj -c Release -- $skinSkeleton $skinAtlas
          if ($LASTEXITCODE -ne 0) { throw 'Costume Spine 4.1 parser failed' }
          # Regression: catalog incorrectly labeled this as 4.0/unverified,
          # while its real .skel header reports Spine 4.1.20.
          & ./native-integration-test/Open-ArchiveCharacter.ps1 -CharacterId c113_01 -DownloadOnly
          if ($LASTEXITCODE -ne 0) { throw 'Misclassified c113_01 costume import failed' }
          $realSkeleton = @(Get-ChildItem -Path ./native-integration-test/res -Recurse -Filter 'c113_01_00.skel')[0].FullName
          $realAtlas = @(Get-ChildItem -Path ./native-integration-test/res -Recurse -Filter 'c113_01_00.atlas')[0].FullName
          dotnet run --project ./native-upstream/SpinePet/tools/skeleton-inspector/SkeletonInspector.csproj -c Release -- $realSkeleton $realAtlas
          if ($LASTEXITCODE -ne 0) { throw 'Actual c113_01 Spine 4.1.20 parser validation failed' }
          Remove-Item ./native-integration-test -Recurse -Force
      - name: Assemble minimal core, optional bridge and corresponding GPL source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./safe-release/core,./safe-release/source | Out-Null
          Move-Item -Path ./native-dist/app -Destination ./safe-release/core/app
          # No game models, custom PowerShell download scripts or protocol changes
          # in the standalone desktop application download.
          New-Item -ItemType Directory -Force -Path ./safe-release/core/res | Out-Null
          'SpinePet model directory. Place licensed Spine 4.1 models here; this file preserves the resource directory when unzipped.' | Set-Content ./safe-release/core/res/README.txt -Encoding utf8
          # Upstream bundles optional Python and shell import tools. They are not
          # required for Spine rendering or for manual .skel/.atlas/.png import.
          foreach ($dir in @('./safe-release/core/app/Tools','./safe-release/core/app/tools')) {
            if (Test-Path $dir) { Remove-Item $dir -Force -Recurse }
          }
          # createdump.exe is a .NET crash-dump helper, not needed to render Spine.
          if (Test-Path ./safe-release/core/app/createdump.exe) { Remove-Item ./safe-release/core/app/createdump.exe -Force }
          Copy-Item ./native-upstream/LICENSE ./safe-release/core/LICENSE-GPL-3.0.txt
          Copy-Item ./native-upstream/NOTICE ./safe-release/core/NOTICE.txt
          Copy-Item ./native-upstream/THIRD_PARTY_NOTICES.md ./safe-release/core/THIRD_PARTY_NOTICES.md
          Copy-Item ./native-desktop/CONCENTUS-LICENSE.txt ./safe-release/core/CONCENTUS-LICENSE.txt
          @'
          Anime Character Archive — native SpinePet core (Windows x64)
          Renderer source: KAIDO-YONAGI/My_SpinePet, GPL-3.0-or-later
          Pinned upstream commit: 6690e986b4da31dc89337794bcef1b45e6531303
          Launch: app/SpinePet.exe
          Website one-click import is implemented natively inside SpinePet.exe.
          Registration is only offered with a visible consent dialog when you launch the app.
          No scripts, shell launchers or separate ZIPs are required.
          This executable is unsigned and has not been certified malware-free.
          For supported NIKKE Spine 4.1: visit the archive, select a model, and click 放到桌面.
          The upstream Add/Scan interface remains available for manual licensed asset import.
          GPL corresponding source is provided as another artifact from this SAME build run.
          See https://github.com/tyqittle/anime-character-archive/tree/main/native-desktop
          '@ | Set-Content ./safe-release/core/README.txt -Encoding utf8

          Copy-Item ./native-upstream/LICENSE ./safe-release/source/LICENSE-GPL-3.0.txt
          git -C native-upstream archive --format=zip --output="$env:GITHUB_WORKSPACE/safe-release/source/My_SpinePet-corresponding-source.zip" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot provide GPL corresponding source' }
          Copy-Item ./native-desktop/Open-ArchiveCharacter.ps1,./native-desktop/Register-Bridge.ps1,./native-desktop/Patch-Upstream.ps1,./native-desktop/Patch-WheelZoom.ps1,./native-desktop/Patch-RenderEnvelope.ps1,./native-desktop/Patch-ViewportSafety.ps1,./native-desktop/NativeArchiveBridge.cs,./native-desktop/NativeBrownDust2Bridge.cs,./native-desktop/NativeBrownDust2Voice.cs,./native-desktop/NativeBrownDust2WebMDecoder.cs,./native-desktop/NativeAutoUpdate.cs,./native-desktop/ArchiveDesktopFullBodyTests.cs,./native-desktop/CONCENTUS-LICENSE.txt -Destination ./safe-release/source
          Copy-Item ./native-desktop/ChooseFoldersInstaller.iss -Destination ./safe-release/source
          @'
          The distributed SpinePet.exe builds pinned upstream source plus NativeArchiveBridge.cs.
          Rebuild by checking out pinned upstream commit, running Patch-Upstream.ps1, then dotnet publish.
          Archive bridge and corresponding patch source are GPL-3.0-or-later.
          '@ | Set-Content ./safe-release/source/REBUILD-INSTRUCTIONS.txt -Encoding utf8
      - name: Create Velopack self-updating installer and update packages
        shell: pwsh
        run: |
          dotnet tool install --global vpk --version 1.2.161
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Velopack CLI installation failed' }
          $version = "0.1.${{ github.run_number }}"
          # Velopack package updates the application folder, so ship upstream
          # GPL license and notices inside that versioned folder too.
          Copy-Item ./safe-release/core/LICENSE-GPL-3.0.txt,./safe-release/core/NOTICE.txt,./safe-release/core/THIRD_PARTY_NOTICES.md,./safe-release/core/CONCENTUS-LICENSE.txt -Destination ./safe-release/core/app
          # Retain the one-click installer for existing users; also produce a
          # standard Windows Installer whose UI supports a selectable folder.
          # Either allows per-user installation without administrator rights.
          vpk pack --packId AnimeCharacterSpinePet --packVersion $version --packDir ./safe-release/core/app --mainExe SpinePet.exe --outputDir ./safe-release/velopack --msi --instLocation Either
          if ($LASTEXITCODE -ne 0) { throw 'Velopack packaging failed' }
          if (@(Get-ChildItem ./safe-release/velopack/*-Setup.exe).Count -lt 1) { throw 'Missing auto-update Setup.exe' }
          if (@(Get-ChildItem ./safe-release/velopack/*.msi).Count -lt 1) { throw 'Missing directory-selectable MSI installer' }
          if (@(Get-ChildItem ./safe-release/velopack/*-full.nupkg).Count -lt 1) { throw 'Missing full update package' }
          if (-not (Test-Path ./safe-release/velopack/releases.win.json)) { throw 'Missing update feed' }
      - name: Build graphical EXE installer with two folder selectors
        shell: pwsh
        run: |
          # Inno Setup is a real compiler; it builds a self-contained graphical
          # EXE that wraps the exact Velopack Setup from the same audited run.
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Cannot install Inno Setup compiler' }
          }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup ISCC.exe not found' }
          $payload = @(Get-ChildItem ./safe-release/velopack/*-Setup.exe)
          if ($payload.Count -ne 1) { throw 'Exactly one canonical Velopack Setup.exe required' }
          $version = "0.1.${{ github.run_number }}"
          $destination = (Resolve-Path ./safe-release/velopack).Path
          & $iscc "/DVelopackSetup=$($payload[0].FullName)" "/DAppVersion=$version" "/O$destination" ./native-desktop/ChooseFoldersInstaller.iss
          if ($LASTEXITCODE -ne 0) { throw 'Two-directory EXE wizard did not compile' }
          if (-not (Test-Path ./safe-release/velopack/AnimeCharacterSpinePet-ChooseFolders-Setup.exe)) {
            throw 'Compiled folder-selectable EXE was not created'
          }
      - name: End-to-end smoke test of the SAME two-folder graphical installer
        shell: pwsh
        run: |
          # This is the exact Inno EXE a user downloads, NOT just its inner
          # Velopack Setup. /SILENT shows the progress GUI without blocking for wizard clicks.
          $wizard = @(Get-ChildItem ./safe-release/velopack/AnimeCharacterSpinePet-ChooseFolders-Setup.exe)
          if ($wizard.Count -ne 1) { throw 'Missing exact two-folder EXE artifact' }
          $root = Join-Path $env:RUNNER_TEMP 'AnimeCharacterTwoFolderSmoke'
          $program = Join-Path $root '程序 安装'
          $models = Join-Path $root '角色 素材'
          $innoLog = Join-Path $env:RUNNER_TEMP 'spinepet-wizard-install.log'
          $arguments = @('/SILENT', '/SUPPRESSMSGBOXES', '/NORESTART',
            ('"/PROGRAMDIR=' + $program + '"'),
            ('"/MODELDIR=' + $models + '"'),
            ('"/LOG=' + $innoLog + '"')) -join ' '
          Write-Host "Testing GUI wrapper with unattended choices and two separate non-default Unicode paths."
          $proc = Start-Process -FilePath $wizard[0].FullName -ArgumentList $arguments -PassThru
          # Do not let a hidden child dialog or a GUI descendant hang CI forever.
          $completed = $proc.WaitForExit(360000)
          if (-not $completed) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }
          $code = if ($completed) { $proc.ExitCode } else { 1460 }
          if (Test-Path $innoLog) {
            Get-Content $innoLog -Tail 65 | ForEach-Object { Write-Host $_ }
          }
          $innerLog = Join-Path $models 'SpinePet-Install.log'
          if (Test-Path $innerLog) {
            Get-Content $innerLog -Tail 40 | ForEach-Object { Write-Host $_ }
          }
          if ($code -ne 0) { throw "FULL INSTALL WIZARD FAILED: exit $code (1460 means timeout)" }
          if (-not (Test-Path $innoLog)) { throw 'Inno install trace was not written' }
          $trace = Get-Content $innoLog -Raw
          if (-not $trace.Contains('Native Velopack GUI bootstrap started') -or
              -not $trace.Contains('Native Velopack GUI installation verified')) {
            throw 'GUI workflow never reached the verified progress-and-finish path'
          }
          if (-not (Test-Path (Join-Path $program 'current/SpinePet.exe'))) {
            throw "Selected program folder missing actual current/SpinePet.exe: $program"
          }
          if (-not (Test-Path (Join-Path $program 'current/sq.version'))) {
            throw 'Selected program folder missing Velopack update structure'
          }
          if (-not (Test-Path $models)) { throw "Selected model folder not created: $models" }
          $saved = (Get-ItemProperty -Path 'HKCU:\Software\AnimeCharacterSpinePet' -Name ResourceDirectory).ResourceDirectory
          if ($saved -ne $models) { throw "Model directory not persisted correctly" }
          Write-Host 'PASS: /SILENT progress UI and verified completion; exact downloadable GUI EXE installed app and saved independent model directory.'
      - name: Generate SHA-256 manifest and run security checks where supported
        shell: pwsh
        run: |
          $core = (Resolve-Path ./safe-release/core).Path
          $paths = @(Get-ChildItem $core -Recurse -File | Sort-Object FullName)
          $hashes = @($paths | ForEach-Object {
            $relative = [System.IO.Path]::GetRelativePath($core, $_.FullName).Replace('\\','/')
            "$(Get-FileHash $_.FullName -Algorithm SHA256 | Select-Object -ExpandProperty Hash)  $relative"
          })
          $hashes | Set-Content ./safe-release/core/SHA256SUMS.txt -Encoding ascii
          $signature = Get-AuthenticodeSignature ./safe-release/core/app/SpinePet.exe
          "SpinePet.exe Authenticode: $($signature.Status)" | Tee-Object -FilePath ./safe-release/core/BUILD-SECURITY-REPORT.txt
          "Source: KAIDO-YONAGI/My_SpinePet at 6690e986b4da31dc89337794bcef1b45e6531303" | Add-Content ./safe-release/core/BUILD-SECURITY-REPORT.txt
          "Core binary executables:" | Add-Content ./safe-release/core/BUILD-SECURITY-REPORT.txt
          @(Get-ChildItem $core -Recurse -File -Include *.exe | ForEach-Object {
            "$([System.IO.Path]::GetRelativePath($core, $_.FullName)) SHA256=$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)"
          }) | Add-Content ./safe-release/core/BUILD-SECURITY-REPORT.txt
          try {
            $status = Get-MpComputerStatus -ErrorAction Stop
            if ($status.AntivirusEnabled -and $status.RealTimeProtectionEnabled) {
              Write-Host 'Microsoft Defender enabled; scanning core and optional bridge.'
              Start-MpScan -ScanType CustomScan -ScanPath (Resolve-Path ./safe-release).Path -ErrorAction Stop
              'Microsoft Defender custom scan completed. This is not a guarantee of safety.' | Add-Content ./safe-release/core/BUILD-SECURITY-REPORT.txt
            } else {
              'Microsoft Defender scanner NOT ACTIVE on build runner; security scan NOT VERIFIED.' | Add-Content ./safe-release/core/BUILD-SECURITY-REPORT.txt
            }
          } catch {
            "Microsoft Defender scanning unavailable: $($_.Exception.Message)" | Add-Content ./safe-release/core/BUILD-SECURITY-REPORT.txt
          }
          # Do not claim that a clean CI run overrides a Chrome Safe Browsing block.
      - name: Upload minimal native renderer
        uses: actions/upload-artifact@v4
        with:
          name: native-spinepet-core-windows-x64
          path: safe-release/core/
          if-no-files-found: error
          retention-days: 14
      - name: Upload verified-package candidates (not released until security audit)
        uses: actions/upload-artifact@v4
        with:
          name: native-spinepet-velopack-windows-x64
          path: safe-release/velopack/
          if-no-files-found: error
          retention-days: 14
      - name: Upload GPL corresponding source
        uses: actions/upload-artifact@v4
        with:
          name: native-spinepet-corresponding-source-GPL
          path: safe-release/source/
          if-no-files-found: error
          retention-days: 14

  security-audit:
    needs: build-native
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download precisely the packaged native renderer
        uses: actions/download-artifact@v4
        with:
          name: native-spinepet-core-windows-x64
          path: native-core
      - name: Download self-updating package for antivirus checks
        uses: actions/download-artifact@v4
        with:
          name: native-spinepet-velopack-windows-x64
          path: native-update-package
      - name: Verify core SHA-256 manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          root=Path('native-core')
          lines=(root/'SHA256SUMS.txt').read_text(encoding='ascii').splitlines()
          assert len(lines)>10, 'Missing meaningful file digest manifest'
          for line in lines:
              digest,name=line.split('  ',1)
              path=root/name.replace('\\','/')
              assert path.is_file(), f'Missing: {name}'
              calculated=hashlib.sha256(path.read_bytes()).hexdigest()
              assert calculated.lower()==digest.lower(), f'Checksum mismatch: {name}'
          assert (root/'app'/'SpinePet.exe').exists()
          assert not list(root.rglob('*.ps1'))
          assert not list(root.rglob('*.cmd'))
          exes=list(root.rglob('*.exe'))
          assert len(exes)==1 and exes[0].name=='SpinePet.exe', f'Unexpected executables: {exes}'
          print(f'Verified {len(lines)} packaged file checksums.')
          PY
      - name: Install independent ClamAV scanner
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam --stdout
          test -f /var/lib/clamav/main.cvd -o -f /var/lib/clamav/main.cld
          test -f /var/lib/clamav/daily.cvd -o -f /var/lib/clamav/daily.cld
      - name: Scan native binaries, DLLs and resources with ClamAV
        shell: bash
        run: |
          clamscan --version
          clamscan --recursive --infected native-core native-update-package
          echo 'ClamAV found no matching known signatures. This does not prove software is safe.'

  publish-updates:
    # Only audited successful packages may enter the public auto-update feed.
    needs: [build-native, security-audit, validate-release]
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    concurrency:
      group: native-velopack-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: native-spinepet-velopack-windows-x64
          path: release-files
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Reject stale native builds so older packages never become latest
        id: latest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # New website/gallery commits may arrive while ClamAV runs.
          # They must NOT invalidate a tested, audited Windows binary.
          # Only a newer change to native source or its release pipeline
          # supersedes this build. Fail closed if GitHub comparison is
          # incomplete, diverged or cannot be trusted.
          $latest = gh api 'repos/${{ github.repository }}/commits/main' --jq '.sha'
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($latest)) {
            throw 'Cannot verify current main commit SHA; refuse to publish'
          }
          $builtSha = '${{ github.sha }}'
          $head = $latest.Trim()
          $publish = 'true'
          if ($head -ne $builtSha) {
            $diff = gh api "repos/${{ github.repository }}/compare/$builtSha...$head" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $null -eq $diff -or
                $diff.status -ne 'ahead' -or
                $null -eq $diff.files -or
                @($diff.files).Count -ge 300) {
              throw 'Cannot safely establish which files changed since this native build'
            }
            $changedNative = @($diff.files | Where-Object {
              $_.filename -like 'native-desktop/*' -or
              $_.filename -eq '.github/workflows/native-spinepet-windows.yml'
            })
            if ($changedNative.Count -gt 0) {
              $publish = 'false'
              Write-Host 'A newer native source or release-workflow change exists:'
              $changedNative | ForEach-Object { Write-Host $_.filename }
            } else {
              Write-Host 'Only website/assets/tests changed; audited native binary is still current.'
            }
          }
          Write-Host "Built SHA=$builtSha; branch HEAD=$head; publish=$publish"
          "publish=$publish" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Publish release installer plus versioned update feed
        if: steps.latest.outputs.publish == 'true'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet tool install --global vpk --version 1.2.161
          if ($LASTEXITCODE -ne 0) { throw 'Missing pinned updater tool' }
          $version = "0.1.${{ github.run_number }}"
          vpk upload github --repoUrl "https://github.com/${{ github.repository }}" --token "$env:GITHUB_TOKEN" --publish --releaseName "SpinePet Desktop $version" --tag "desktop-v$version" --outputDir ./release-files
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release upload failed; no update was published' }
          # Velopack GitHub upload may focus on package/feed files. Ensure the
          # independently scanned MSI is actually downloadable from Releases.
          $tag = "desktop-v$version"
          $msi = @(Get-ChildItem ./release-files/*.msi)
          $wizard = @(Get-ChildItem ./release-files/AnimeCharacterSpinePet-ChooseFolders-Setup.exe)
          if ($msi.Count -ne 1 -or $wizard.Count -ne 1) {
            throw 'Expected one MSI and one audited dual-folder Windows EXE'
          }
          $published = gh release view $tag --repo "${{ github.repository }}" --json assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify published release assets' }
          foreach ($artifact in @($msi[0], $wizard[0])) {
            if (-not @($published.assets | Where-Object { $_.name -eq $artifact.Name }).Count) {
              gh release upload $tag $artifact.FullName --repo "${{ github.repository }}"
              if ($LASTEXITCODE -ne 0) { throw "Unable to upload audited installer: $($artifact.Name)" }
            }
          }
          gh release edit "desktop-v$version" --repo "${{ github.repository }}" --latest
          if ($LASTEXITCODE -ne 0) { throw 'Unable to mark latest audited release for desktop auto-update' }
