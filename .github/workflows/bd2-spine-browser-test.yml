name: Verify Brown Dust 2 full-character Spine playback
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bd2-spine-browser-test.yml'
      - 'scripts/test_bd2_spine_browser.mjs'
      - 'data/spine-bd2-pilot.json'
      - 'spine.html'
      - 'assets/js/spine/spine-runtime.js'
      - 'assets/js/spine/viewer-controls.js'
      - 'assets/js/spine/performance.js'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  live-animation:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and PNG decoder
        run: npm install --no-save --no-package-lock playwright-core@1.56.1 pngjs@7.0.0
      - name: Start local site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/site.log 2>&1 &
          sleep 2
      - name: Verify all five actual BD2 model animations
        run: node scripts/test_bd2_spine_browser.mjs
      - name: Upload render screenshots and detailed results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bd2-full-character-live-check
          path: |
            /tmp/bd2-spine-browser-results.json
            /tmp/bd2-*.png
          if-no-files-found: warn
