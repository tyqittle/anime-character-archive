name: Import Blue Archive full-body art
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-bluearchive.yml'
      - 'scripts/import_bluearchive.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import validated SchaleDB student portraits
        env:
          BA_IMPORT_LIMIT: '150'
        run: python scripts/import_bluearchive.py
      - name: Commit student PNG or WebP assets and game index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/characters.json assets/portraits/
          if ! git diff --cached --quiet; then
            git commit -m "Import Blue Archive static character artwork"
            git push origin HEAD:main
          fi

