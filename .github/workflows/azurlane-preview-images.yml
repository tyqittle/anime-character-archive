name: Capture Azur Lane Live2D model previews
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/azurlane-preview-images.yml'
      - 'data/live2d-azurlane.json'
      - 'scripts/preview_policy.py'
      - 'scripts/render_azurlane_previews.mjs'
      - 'scripts/convert_azurlane_previews.py'
      - 'scripts/merge_azurlane_previews.py'
      - 'azurlane-stage.html'
      - 'assets/spine-theater-layout.css'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock playwright-core@1.56.1
          python3 -m pip install --quiet --break-system-packages Pillow
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/al-server.log 2>&1 &
          sleep 2
      - run: |
          node scripts/render_azurlane_previews.mjs ${{ matrix.shard }} 8
          python3 scripts/convert_azurlane_previews.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azurlane-frame-${{ matrix.shard }}
          path: assets/animation-previews/azurlane-*.webp
          if-no-files-found: ignore
          retention-days: 3
  publish:
    needs: capture
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet --break-system-packages Pillow
      - uses: actions/download-artifact@v4
        with:
          pattern: azurlane-frame-*
          merge-multiple: true
          path: assets/animation-previews
      - run: python3 scripts/merge_azurlane_previews.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/animation-previews/azurlane-*.webp data/live2d-azurlane.json data/azurlane-import-audit.json
          if ! git diff --cached --quiet; then
            git commit -m 'Add model-specific Azur Lane Live2D WebP previews'
            git push origin HEAD:main
          fi
