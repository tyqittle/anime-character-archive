name: Character archive checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: archive-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test asynchronous playback and shared voice lifecycle
        run: node --test tests/test_async_playback.mjs tests/test_spine_highdpi.mjs tests/test_spine_illustration_quality.mjs tests/test_animation_frames.mjs tests/test_spine_utf8.mjs tests/test_desktop_launch.mjs
      - name: Validate archive metadata and entrypoints
        run: node tests/smoke.mjs
      - name: Test animation skin deduplication and voice aliases
        run: node --test tests/test_animation_dedup.mjs
      - name: Test pinned Live2D source URL restrictions
        run: node --test tests/test_additional_live2d_catalog.mjs
      - name: Test bounded animation memory cache
        run: node tests/test_spine_session_cache.mjs
      - name: Test shared preview policy
        run: |
          python3 -m pip install --quiet --break-system-packages Pillow
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Syntax-check renamed maintenance scripts
        run: python3 -m py_compile start_site.py scripts/mirror_static_portraits.py
