name: Character archive checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate archive metadata and entrypoints
        run: node tests/smoke.mjs
      - name: Test shared preview policy
        run: |
          python3 -m pip install --quiet --break-system-packages Pillow
          python3 -m unittest discover -s tests -p 'test_preview_*.py'
      - name: Syntax-check renamed maintenance scripts
        run: python3 -m py_compile start_site.py scripts/mirror_static_portraits.py
