name: Refresh static archive sources
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-archive-content.yml'
      - 'scripts/expand_static_archive.py'
      - 'data/static-source-plan.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    concurrency:
      group: art-import-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow
      - name: Import all missing verified source art
        run: python scripts/expand_static_archive.py
      - uses: ./.github/actions/finalize-static-catalog
      - name: Publish complete original-and-thumbnail sets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/characters.json data/static-coverage.json assets/portraits/ assets/thumbs/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Expand verified full-art coverage across archived games"
          git pull --rebase origin main
          git push origin HEAD:main
