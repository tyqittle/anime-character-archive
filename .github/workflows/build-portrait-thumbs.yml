name: Build lightweight character thumbnails
on:
  push:
    branches: [main]
    paths:
      - 'assets/portraits/**'
      - 'scripts/build_portrait_thumbs.py'
      - '.github/workflows/build-portrait-thumbs.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: portrait-thumbnails
  cancel-in-progress: false
jobs:
  thumbnails:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Render compressed previews and update catalog
        run: python scripts/build_portrait_thumbs.py
      - name: Validate catalog-to-thumbnail linkage
        run: |
          python - <<'PY'
          import json, pathlib
          from PIL import Image
          db=json.loads(pathlib.Path('data/characters.json').read_text(encoding='utf-8'))
          missing=[]
          validated=0
          for c in db['characters']:
              if not c.get('thumb'):
                  missing.append(c.get('id'))
                  continue
              path=pathlib.Path(c['thumb'].removeprefix('./'))
              if not path.is_file() or path.stat().st_size < 500:
                  missing.append(c.get('id'))
                  continue
              with Image.open(path) as im:
                  im.verify()
              validated+=1
          print("Validated", validated, "thumbnails. Missing",len(missing),missing[:20])
          assert validated >= 300, 'Too few thumbnail files generated'
          PY
      - name: Publish thumbnail files in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/thumbs/ data/characters.json
          if ! git diff --cached --quiet; then
            git commit -m "Add compact thumbnails for faster character gallery"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
