name: Validate additional game animations
on:
  push:
    branches: [main]
    paths:
      - 'data/spine-newgames.json'
      - 'data/live2d-moregames.json'
      - 'data/live2d-highquality.json'
      - 'data/live2d-mature.json'
      - 'data/live2d-expanded-games.json'
      - 'data/live2d-mature-followup.json'
      - 'data/spine-mature-expansion.json'
      - 'data/spine-source-scopes.json'
      - 'data/spine-games-*.json'
      - 'data/live2d-games-*.json'
      - 'data/animation-catalogs.json'
      - 'data/hosted-spine-source-scopes.json'
      - 'scripts/import_hosted_spine.mjs'
      - 'scripts/test_hosted_spine_browser.mjs'
      - 'scripts/import_spine_source.py'
      - 'data/live2d-source-scopes.json'
      - 'scripts/live2d_sources.mjs'
      - 'scripts/test_cubism_source_browser.mjs'
      - 'scripts/archive_browser.mjs'
      - 'tests/test_live2d_sources.mjs'
      - 'assets/js/spine/**'
      - 'assets/js/live2d/**'
      - 'spine.html'
      - 'azurlane-stage.html'
      - 'scripts/test_additional_game_animations.mjs'
      - 'scripts/diagnose_live2d_models.mjs'
      - 'assets/js/shared/cubism-motion-policy.js'
      - 'assets/js/shared/spine-companions.js'
      - 'assets/js/shared/indexeddb-storage.js'
      - 'assets/js/shared/voice-playback.js'
      - 'scripts/test_module_isolation_browser.mjs'
      - 'scripts/test_theater_experience_browser.mjs'
      - 'scripts/test_rich_interactions_browser.mjs'
      - 'scripts/theater_browser_helpers.mjs'
      - 'assets/spine-experience-v2.css'
      - '.github/workflows/newgames-animation-check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  hosted-scopes:
    runs-on: ubuntu-latest
    outputs:
      scopes: ${{ steps.scopes.outputs.value }}
      cubism: ${{ steps.cubism.outputs.cubism }}
    steps:
      - uses: actions/checkout@v4
      - id: scopes
        run: node -e "const fs=require('fs');fs.appendFileSync(process.env.GITHUB_OUTPUT,'value='+JSON.stringify(JSON.parse(fs.readFileSync('data/hosted-spine-source-scopes.json')).scopes.map(s=>s.id))+'\n')"
      - run: node -e "const fs=require('fs'),scopes=JSON.parse(fs.readFileSync('data/live2d-source-scopes.json')).scopes,catalogs=JSON.parse(fs.readFileSync('data/animation-catalogs.json')).catalogs;fs.appendFileSync(process.env.GITHUB_OUTPUT,'cubism='+JSON.stringify(catalogs.filter(c=>scopes.some(s=>s.catalog===c.path&&s.preflightIds?.length)).map(c=>c.id))+'\n')"
        id: cubism
  cubism-portraits:
    needs: hosted-scopes
    if: needs.hosted-scopes.outputs.cubism != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        catalog: ${{ fromJson(needs.hosted-scopes.outputs.cubism) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright-core@1.56.1 pngjs@7.0.0
      - run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/cubism-source-site.log 2>&1 &
      - name: Verify exact Cubism source models, real motion and return to idle
        env:
          MODULE_TEST_BASE_URL: http://127.0.0.1:8765
        run: node scripts/test_cubism_source_browser.mjs --catalog "${{ matrix.catalog }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cubism-source-browser-${{ matrix.catalog }}
          path: tmp/cubism-source-browser/
  hosted-portraits:
    needs: hosted-scopes
    strategy:
      fail-fast: false
      matrix:
        scope: ${{ fromJson(needs.hosted-scopes.outputs.scopes) }}
    env:
      ARCHIVE_PREFLIGHT_SCOPE: ${{ matrix.scope }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright-core@1.56.1 pngjs@7.0.0
      - run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/hosted-spine-site.log 2>&1 &
      - name: Verify original source bytes and production-origin CORS before browser rendering
        run: node scripts/source_asset_cache.mjs --preflight
      - name: Verify hosted source byte locks, real motion, skins and theater controls
        env:
          ARCHIVE_PREVIEW_SOURCE_CACHE: tmp/hosted-spine-browser-source/index.json
        run: node scripts/test_hosted_spine_browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-spine-browser-${{ matrix.scope }}
          path: tmp/hosted-spine-browser/
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright driver
        run: npm install --no-save --no-package-lock playwright-core@1.56.1 pngjs@7.0.0
      - name: Serve local site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/newgames-server.log 2>&1 &
          sleep 2
      - name: Render real models from three imported game groups
        run: node scripts/test_additional_game_animations.mjs
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newgames-browser-report
          path: |
            tmp/animation-check/
            /tmp/newgames-server.log
          if-no-files-found: ignore

  module-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright-core@1.56.1 pngjs@7.0.0
      - name: Serve the framework under test
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/module-site.log 2>&1 &
          sleep 2
      - name: Verify optional failures and obsolete requests cannot affect the active engine
        run: node scripts/test_module_isolation_browser.mjs
      - name: Verify theater browsing, quick controls and mobile drawers with real models
        env:
          MODULE_TEST_BASE_URL: http://127.0.0.1:8765
        run: node scripts/test_theater_experience_browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: module-isolation-results
          path: |
            tmp/module-isolation-browser/
            tmp/theater-experience/
            /tmp/module-site.log

  cubism-behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright-core@1.56.1 pngjs@7.0.0
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/cubism-site.log 2>&1 &
          sleep 2
      - name: Inspect actual Cubism alpha, source motions and rendered geometry
        run: node scripts/diagnose_live2d_models.mjs --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cubism-behavior-results
          path: /tmp/cubism-behavior-diagnostics.json

  rich-interactions:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - name: Serve the theater
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/rich-site.log 2>&1 &
          sleep 2
      - name: Verify rich interactions, source hit meshes and return to standby
        run: node scripts/test_rich_interactions_browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rich-interactions-results
          path: |
            tmp/rich-interactions/
            /tmp/rich-site.log

  source-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit every declared source scope and verify Fox import idempotence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/live2d_sources.mjs --output /tmp/live2d-source-coverage.json
          node scripts/live2d_sources.mjs --scope foxhimezero --import foxhimezero --dry-run --output /tmp/fox-import-validation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live2d-source-coverage
          path: |
            /tmp/live2d-source-coverage.json
            /tmp/fox-import-validation.json
