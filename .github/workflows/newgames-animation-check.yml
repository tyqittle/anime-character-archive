name: Validate additional game animations
on:
  push:
    branches: [main]
    paths:
      - 'data/spine-newgames.json'
      - 'data/live2d-moregames.json'
      - 'data/live2d-highquality.json'
      - 'data/live2d-mature.json'
      - 'data/live2d-expanded-games.json'
      - 'data/live2d-mature-followup.json'
      - 'data/spine-mature-expansion.json'
      - 'data/spine-source-scopes.json'
      - 'scripts/import_spine_source.py'
      - 'data/live2d-source-scopes.json'
      - 'scripts/live2d_sources.mjs'
      - 'tests/test_live2d_sources.mjs'
      - 'assets/js/spine/**'
      - 'assets/js/live2d/**'
      - 'spine.html'
      - 'azurlane-stage.html'
      - 'scripts/test_additional_game_animations.mjs'
      - 'scripts/diagnose_live2d_models.mjs'
      - 'assets/js/shared/cubism-motion-policy.js'
      - '.github/workflows/newgames-animation-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright driver
        run: npm install --no-save --no-package-lock playwright-core@1.56.1 pngjs@7.0.0
      - name: Serve local site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/newgames-server.log 2>&1 &
          sleep 2
      - name: Render real models from three imported game groups
        run: node scripts/test_additional_game_animations.mjs
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newgames-browser-report
          path: |
            tmp/animation-check/
            /tmp/newgames-server.log
          if-no-files-found: ignore

  cubism-behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright-core@1.56.1 pngjs@7.0.0
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/cubism-site.log 2>&1 &
          sleep 2
      - name: Inspect actual Cubism alpha, source motions and rendered geometry
        run: node scripts/diagnose_live2d_models.mjs --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cubism-behavior-results
          path: /tmp/cubism-behavior-diagnostics.json

  source-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit every declared source scope and verify Fox import idempotence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/live2d_sources.mjs --output /tmp/live2d-source-coverage.json
          node scripts/live2d_sources.mjs --scope foxhimezero --import foxhimezero --dry-run --output /tmp/fox-import-validation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live2d-source-coverage
          path: |
            /tmp/live2d-source-coverage.json
            /tmp/fox-import-validation.json
