name: Validate additional game animations
on:
  push:
    branches: [main]
    paths:
      - 'data/spine-newgames.json'
      - 'data/live2d-moregames.json'
      - 'data/live2d-highquality.json'
      - 'data/live2d-mature.json'
      - 'assets/js/spine/**'
      - 'assets/js/live2d/**'
      - 'spine.html'
      - 'azurlane-stage.html'
      - 'scripts/test_additional_game_animations.mjs'
      - 'scripts/diagnose_daiblos_atlas.mjs'
      - '.github/workflows/newgames-animation-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright driver
        run: npm install --no-save --no-package-lock playwright-core@1.56.1 pngjs@7.0.0
      - name: Serve local site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/newgames-server.log 2>&1 &
          sleep 2
      - name: Render real models from three imported game groups
        run: node scripts/test_additional_game_animations.mjs
      - name: Compare UV mapping on coherent and fragmented Spine rigs
        if: always()
        run: |
          python -m pip install -r requirements-dev.txt
          node scripts/diagnose_daiblos_atlas.mjs
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0,'scripts')
          from audit_animation_visual_integrity import connectivity
          for path in sorted(Path('/tmp/daiblos-uv-diagnostic').glob('*.png')):
              print('UV_DIAGNOSTIC_METRIC',path.name,connectivity(path))
          PY
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newgames-browser-report
          path: |
            /tmp/newgames-animation-results.json
            /tmp/newgames-*.png
            /tmp/newgames-server.log
            /tmp/daiblos-uv-diagnostic/
          if-no-files-found: ignore
